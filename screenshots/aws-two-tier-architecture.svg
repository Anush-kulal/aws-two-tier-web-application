<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120">
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0 0 L0 8 L11 4 Z" fill="#48617d"/></marker>
  <marker id="greenArrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0 0 L0 8 L11 4 Z" fill="#39845a"/></marker>
  <style>
    .title{font:700 34px Arial,sans-serif;fill:#12365a}.subtitle{font:18px Arial,sans-serif;fill:#53677d}
    .heading{font:700 22px Arial,sans-serif;fill:#173b61}.body{font:18px Arial,sans-serif;fill:#26384a}
    .small{font:15px Arial,sans-serif;fill:#53677d}.tiny{font:14px Arial,sans-serif;fill:#53677d}
    .vpc{fill:#f6f9fd;stroke:#365e87;stroke-width:3}.public{fill:#eaf4ff;stroke:#4d89bb;stroke-width:3}
    .private{fill:#edf7ef;stroke:#57936b;stroke-width:3}.alb{fill:#fff3dc;stroke:#c28b2b;stroke-width:3}
    .server{fill:white;stroke:#4b79a4;stroke-width:2.5}.database{fill:white;stroke:#49815b;stroke-width:2.5}
    .route{fill:none;stroke:#48617d;stroke-width:4;marker-end:url(#arrow)}
    .dbroute{fill:none;stroke:#39845a;stroke-width:4;marker-end:url(#greenArrow)}
    .note{fill:#fff7e8;stroke:#d39a43;stroke-width:2}
  </style>
</defs>
<rect width="1600" height="1120" fill="#ffffff"/>
<text x="800" y="52" class="title" text-anchor="middle">AWS TWO-TIER WEB APPLICATION</text>
<text x="800" y="84" class="subtitle" text-anchor="middle">Actual deployed topology | ap-south-1 (Mumbai)</text>

<rect x="45" y="115" width="1510" height="955" rx="24" class="vpc"/>
<text x="78" y="158" class="heading">Custom VPC: TwoTier-Project-VPC</text>
<text x="78" y="188" class="small">CIDR: 10.0.0.0/16 | Public and private subnet routing</text>

<rect x="585" y="215" width="430" height="74" rx="14" class="server"/>
<text x="800" y="246" class="heading" text-anchor="middle">Users / Internet</text>
<text x="800" y="272" class="body" text-anchor="middle">HTTP request :80</text>

<rect x="500" y="325" width="600" height="115" rx="16" class="alb"/>
<text x="800" y="364" class="heading" text-anchor="middle">Internet-facing Application Load Balancer</text>
<text x="800" y="394" class="body" text-anchor="middle">TwoTier-App-ALB | Listener HTTP :80</text>
<text x="800" y="421" class="small" text-anchor="middle">Forwards to TwoTier-App-TG on HTTP :3000</text>
<path d="M800 289 V322" class="route"/>

<rect x="95" y="480" width="680" height="300" rx="18" class="public"/>
<rect x="825" y="480" width="680" height="300" rx="18" class="public"/>
<text x="125" y="522" class="heading">Public-Subnet-A | ap-south-1a</text>
<text x="125" y="550" class="small">10.0.1.0/24 | Route to Internet Gateway</text>
<text x="855" y="522" class="heading">Public-Subnet-B | ap-south-1b</text>
<text x="855" y="550" class="small">10.0.2.0/24 | Route to Internet Gateway</text>

<rect x="165" y="592" width="540" height="145" rx="14" class="server"/>
<text x="435" y="630" class="heading" text-anchor="middle">EC2 Application Instance 1</text>
<text x="435" y="660" class="body" text-anchor="middle">TwoTier-App-Server-1</text>
<text x="435" y="690" class="small" text-anchor="middle">Amazon Linux 2023 | Node.js / Express</text>
<text x="435" y="716" class="small" text-anchor="middle">Application port :3000</text>

<rect x="895" y="592" width="540" height="145" rx="14" class="server"/>
<text x="1165" y="630" class="heading" text-anchor="middle">EC2 Application Instance 2</text>
<text x="1165" y="660" class="body" text-anchor="middle">TwoTier-App-Server-2</text>
<text x="1165" y="690" class="small" text-anchor="middle">Amazon Linux 2023 | Node.js / Express</text>
<text x="1165" y="716" class="small" text-anchor="middle">Application port :3000</text>

<path d="M650 440 L435 588" class="route"/>
<path d="M950 440 L1165 588" class="route"/>
<text x="535" y="493" class="tiny" text-anchor="middle">ALB to target :3000</text>
<text x="1065" y="493" class="tiny" text-anchor="middle">ALB to target :3000</text>

<rect x="95" y="820" width="1410" height="192" rx="18" class="private"/>
<text x="125" y="860" class="heading">Private DB subnet group: TwoTier-DB-Subnet-Group</text>
<text x="125" y="888" class="small">Private-DB-Subnet-A: 10.0.21.0/24 | Private-DB-Subnet-B: 10.0.22.0/24</text>
<rect x="430" y="914" width="740" height="76" rx="14" class="database"/>
<text x="800" y="946" class="heading" text-anchor="middle">Amazon RDS for MySQL</text>
<text x="800" y="974" class="small" text-anchor="middle">two-tier-mysql-db | TCP :3306 | Public access: No | Single-AZ instance</text>

<path d="M435 737 L650 910" class="dbroute"/>
<path d="M1165 737 L950 910" class="dbroute"/>
<text x="525" y="827" class="tiny" text-anchor="middle">EC2 to RDS :3306</text>
<text x="1075" y="827" class="tiny" text-anchor="middle">EC2 to RDS :3306</text>

<rect x="1110" y="215" width="390" height="74" rx="12" class="note"/>
<text x="1305" y="244" class="small" text-anchor="middle">Private-App-Subnet-A and B</text>
<text x="1305" y="269" class="tiny" text-anchor="middle">Created during setup; currently unused</text>

<text x="800" y="1040" class="small" text-anchor="middle">Security-group flow: Internet to ALB :80 | ALB to EC2 :3000 | EC2 to private RDS :3306</text>
<text x="800" y="1062" class="tiny" text-anchor="middle">The two EC2 instances run in public subnets; the RDS instance is Single-AZ within a private DB subnet group.</text>
</svg>